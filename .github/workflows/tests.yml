name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev,pdf]'
      - run: python -m unittest discover -s tests
      - run: commitments demo --output runs/demo
      - run: commitments evaluate --output runs/evaluation
      - run: python scripts/check_package.py
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/commitments.py demo --output runs/demo
      - run: python scripts/commitments.py portfolio --reports runs/demo/report --output runs/demo/index
      - run: npx pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
      - run: npx pnpm@11.25.0 test:ui
      - run: npx pnpm@11.25.0 test:portfolio
